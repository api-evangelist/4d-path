aid: 4d-path
name: 4D Path
description: '4D Path, Inc. is a Newton, Massachusetts computational-pathology company founded
  in 2016 that builds the Q-plasia OncoReader (QPOR) platform, a patented, cloud-based precision
  oncology and computer-aided cancer diagnostic system. Rather than conventional image-classification
  AI, QPOR applies statistical physics and cancer biology to digitized H&E-stained whole-slide
  biopsy and resection images to measure and quantify cell-cycle deregulation and tumor immune
  microenvironment dynamics, producing biomarker profiling, grading and therapy-response
  prediction without additional molecular assays such as IHC, FISH, RNA-Seq or NGS. Its lead
  software-as-a-medical-device product, 4D Q-plasia OncoReader Breast, received FDA Breakthrough
  Device Designation in November 2020, and the company has partnered with PathPresenter to
  distribute the reader inside the ClinPx clinical workflow platform. 4D Path publishes no public
  developer program, API reference, SDK or machine-readable contract of any kind — see x-coverage.'
